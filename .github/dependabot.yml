version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Toolchain holds (see the fix(deps) pin commit): eslint-plugin-react
    # 7.x has no eslint 10 peer range (npm ci ERESOLVE), and
    # typescript-eslint 8.x supports typescript <6.1. Remove each ignore
    # once upstream ships support.
    ignore:
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      eslint-core:
        patterns:
          - "eslint"
          - "@eslint/*"
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      typescript-toolchain:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      vite-toolchain:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "vite-plugin-pwa"
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      firebase-sdk:
        patterns:
          - "firebase"
          - "@firebase/*"
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
